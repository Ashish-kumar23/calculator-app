<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calc">
        <!-- Display Screen -->
        <input type="text" id="screen" >
        
        <!-- Buttons -->
        <div class="keys">
            <button >C</button>
            <button >/</button>
            <button >*</button>
            <button >-</button>
            
            <button >7</button>
            <button >8</button>
            <button >9</button>
            <button >+</button>
            
            <button >4</button>
            <button >5</button>
            <button >6</button>
            <button class="equal">=</button>
            
            <button >1</button>
            <button >2</button>
            <button >3</button>
            <button >0</button>
        </div>
    </div>

    <script src="calculate.js"></script>
</body>
</html>
